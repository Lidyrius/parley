# Generate the Xcode project with `xcodegen generate` (the .xcodeproj is git-ignored).
name: ParleyMobile
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 384887N3UL
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "33"
targets:
  ParleyMobile:
    type: application
    platform: iOS
    sources: [ParleyMobile]
    info:
      path: ParleyMobile/Info.plist
      properties:
        CFBundleDisplayName: Parley
        # What Siri hears for "Parley" (German speech) — App Shortcut phrases match these too.
        INAlternativeAppNames:
          - INAlternativeAppName: Parlay
          - INAlternativeAppName: Parlei
          - INAlternativeAppName: Parle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Parley nutzt die Kamera, um den QR-Code zum Verbinden mit deinem Mac zu scannen.
        NSMicrophoneUsageDescription: Parley nutzt das Mikrofon während eines Anrufs, damit du mit Parley auf deinem Mac sprechen kannst.
        NSSpeechRecognitionUsageDescription: Parley erkennt während eines Anrufs „Hey Parley“ – die Spracherkennung läuft dafür nach Möglichkeit direkt auf dem iPhone.
        # A call keeps running with the screen locked (audio); VoIP pushes ring the phone (voip).
        UIBackgroundModes: [audio, voip]
        CFBundleURLTypes:
          - CFBundleURLName: de.developaway.parley.mobile
            CFBundleURLSchemes: [parley]
        # Debug builds may pair with a relay running under `wrangler dev` on this Mac (ws://localhost).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.developaway.parley.mobile
        PRODUCT_NAME: ParleyMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
      # Push (VoIP via PushKit): APNs sandbox for Debug, production for Release.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ParleyMobile/ParleyMobile-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: ParleyMobile/ParleyMobile-Release.entitlements
  ParleyMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ParleyMobileTests]
    dependencies:
      - target: ParleyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.developaway.parley.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ParleyMobile:
    build:
      targets:
        ParleyMobile: all
        ParleyMobileTests: [test]
    test:
      config: Debug
      targets: [ParleyMobileTests]
    run:
      config: Debug
