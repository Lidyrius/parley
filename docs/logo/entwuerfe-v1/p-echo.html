<!doctype html>
<html><head><meta charset="utf-8"><title>Parley Logos</title>
<style>
  body{margin:0;background:#f2f2f4;font:13px -apple-system,"SF Pro Text",sans-serif;color:#1d1d1f}
  h1{font:600 22px -apple-system,"SF Pro Display";margin:28px 32px 4px}
  p.sub{margin:0 32px 20px;color:#6e6e73}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;padding:0 32px 32px}
  .card{background:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .icon{width:150px;height:150px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22))}
  .name{font-weight:600}.dir{color:#86868b;font-size:11px;margin-top:-10px}
  .bars{display:flex;gap:8px}
  .bar{width:64px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .bar.l{background:#e8e8ed;color:#000}.bar.d{background:#1e1e20;color:#fff}
  .bar svg{width:18px;height:18px}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <!-- glyphs: 100x100, currentColor only, so they double as menu-bar templates -->
  <symbol id="g1" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M30 86V14" stroke-width="8"/><path d="M30 18a22 22 0 0 1 0 44" stroke-width="8"/><path d="M30 30a10 10 0 0 1 0 20" stroke-width="8"/><path d="M30 6a34 34 0 0 1 0 68" stroke-width="5" opacity=".5"/></symbol>
  <symbol id="g2" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M32 80V18" stroke-width="8"/><path d="M32 18a22 22 0 0 1 0 44" stroke-width="8"/><path d="M32 30a10 10 0 0 1 0 20" stroke-width="8"/><path d="M32 8a32 32 0 0 1 0 64" stroke-width="5" opacity=".5"/></symbol>
  <symbol id="g3" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="6"><path d="M30 88V8"/><path d="M30 32a8 8 0 0 1 0 16"/><path d="M30 24a16 16 0 0 1 0 32" opacity=".8"/><path d="M30 16a24 24 0 0 1 0 48" opacity=".55"/><path d="M30 8a32 32 0 0 1 0 64" opacity=".3"/></symbol>
  <symbol id="g4" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="11"><path d="M30 84V16"/><path d="M30 16a26 26 0 0 1 0 52"/><path d="M30 32a10 10 0 0 1 0 20"/></symbol>
  <symbol id="g5" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M28 88V12" stroke-width="8"/><path d="M36.1 28.7A12 12 0 0 1 36.1 51.3" stroke-width="8"/><path d="M40.2 17.4A24 24 0 0 1 40.2 62.6" stroke-width="7"/><path d="M44.3 6.2A36 36 0 0 1 44.3 73.8" stroke-width="5" opacity=".45"/></symbol>
  <symbol id="g6" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M30 86V22a14 14 0 0 1 0 28" stroke-width="8"/><path d="M42 15.2A24 24 0 0 1 42 56.8" stroke-width="6" opacity=".75"/><path d="M47 6.6A34 34 0 0 1 47 65.4" stroke-width="5" opacity=".4"/></symbol>
  <symbol id="g7" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M30 96V28" stroke-width="8"/><path d="M30 28a22 22 0 0 1 0 44" stroke-width="8"/><path d="M30 40a10 10 0 0 1 0 20" stroke-width="8"/><path d="M30 16a34 34 0 0 1 0 68" stroke-width="5" opacity=".5"/></symbol>
  <symbol id="g8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M30 86V12" stroke-width="8"/><circle cx="37" cy="40" r="5" fill="currentColor" stroke="none"/><path d="M30 24a16 16 0 0 1 0 32" stroke-width="8"/><path d="M30 12a28 28 0 0 1 0 56" stroke-width="6" opacity=".65"/><path d="M30 2a38 38 0 0 1 0 76" stroke-width="4" opacity=".3"/></symbol>
  <symbol id="g9" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4.5"><path d="M30 90V10"/><path d="M30 32a8 8 0 0 1 0 16"/><path d="M30 24a16 16 0 0 1 0 32"/><path d="M30 16a24 24 0 0 1 0 48"/><path d="M30 8a32 32 0 0 1 0 64"/></symbol>
  <symbol id="g10" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M30 64V14" stroke-width="8"/><path d="M30 74v0M30 84v0M30 94v0" stroke-width="7" opacity=".6"/><path d="M30 18a22 22 0 0 1 0 44" stroke-width="8"/><path d="M30 30a10 10 0 0 1 0 20" stroke-width="8"/><path d="M30 6a34 34 0 0 1 0 68" stroke-width="5" stroke-dasharray="3 9" opacity=".6"/></symbol>

  <!-- shared glass: top sheen + hairline rim -->
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
</svg>
<h1>Parley — zehn Varianten von „P Echo“</h1>
<p class="sub">Je ein App-Icon (macOS-Squircle, Glas-Schimmer) und dieselbe Glyphe als Menüleisten-Template, hell und dunkel, 18 pt.</p>
<div class="grid" id="grid"></div>
<script>
const L=[
 ["Original","Referenz","#5e5ce6","#1e1b6b","#bdbcff"],
 ["Kompakt","kürzerer Stamm","#5e5ce6","#1e1b6b","#bdbcff"],
 ["Nachhall","vier Echos, verblassend","#5e5ce6","#1e1b6b","#bdbcff"],
 ["Bold","kräftig, zwei Bögen","#5e5ce6","#1e1b6b","#bdbcff"],
 ["Gelöst","Echos frei vom Stamm","#3a3f63","#0b0d17","#8f7bff"],
 ["Klassisch","geschlossenes P + Echos","#2c2c2e","#000","#bdbcff"],
 ["Kleines p","Unterlänge","#14a3a8","#063a46","#9ff6ee"],
 ["Quelle","Punkt als Sprecher","#5b3fd0","#160b45","#c3b4ff"],
 ["Fein","feine Linien, fünf Bögen","#0f1c3d","#000814","#64e3ff"],
 ["Ausklang","Stamm und Echo gepunktet","#ff8a50","#c2361b","#ffe0c8"]];
document.getElementById('grid').innerHTML=L.map(([n,d,a,b,glow],i)=>`
 <div class="card">
  <svg class="icon" viewBox="0 0 120 120">
   <defs><linearGradient id="bg${i}" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
   <radialGradient id="halo${i}"><stop offset="0" stop-color="${glow}" stop-opacity=".55"/><stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient></defs>
   <rect width="120" height="120" rx="27" fill="url(#bg${i})"/>
   <circle cx="60" cy="62" r="46" fill="url(#halo${i})"/>
   <use href="#g${i+1}" x="22" y="22" width="76" height="76" style="color:#fff" filter="url(#glow)"/>
   <rect width="120" height="120" rx="27" fill="url(#sheen)"/>
   <rect x=".75" y=".75" width="118.5" height="118.5" rx="26.3" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
  </svg>
  <div class="name">${i+1} · ${n}</div><div class="dir">${d}</div>
  <div class="bars"><div class="bar l"><svg><use href="#g${i+1}"/></svg></div><div class="bar d"><svg><use href="#g${i+1}"/></svg></div></div>
 </div>`).join('');
</script>
</body></html>
