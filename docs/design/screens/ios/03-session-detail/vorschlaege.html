<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Session-Detail Vorschläge</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#1f1e1c;--sec:#8a8781;--line:#ece9e2;--clay:#d97757;--soft:#f6e6df;--blue:#5b8def;--green:#4fa36a;--track:#efece5;--code:#f1efe9}
*{box-sizing:border-box}body{margin:0;background:#e6e4de;font:15px -apple-system,system-ui,sans-serif;color:var(--ink)}
.stage{display:flex;gap:28px;padding:28px;align-items:flex-start}
.ph{width:402px;height:874px;background:var(--bg);border-radius:54px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.18);flex:none;display:flex;flex-direction:column}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 34px;font:600 16px -apple-system,system-ui,sans-serif;flex:none}
.cap{margin-top:12px;font:600 17px -apple-system,system-ui,sans-serif;width:402px}.cap small{display:block;font-weight:400;color:#6e6c66;font-size:13px;margin-top:3px;line-height:1.4}
.nav{display:flex;align-items:center;gap:10px;padding:4px 14px 8px;flex:none}
.circ{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08);flex:none}.circ img{width:17px;height:17px;object-fit:contain}
.ttl{flex:1;text-align:center;line-height:1.15}.ttl b{font-size:17px}.ttl small{display:block;font-size:12.5px}
.body{flex:1;overflow:hidden;padding:0 18px;position:relative}
.ic{width:15px;height:15px;object-fit:contain;vertical-align:-2px}
p{margin:0 0 12px;line-height:1.42}
code{font:13.5px ui-monospace,Menlo,monospace;background:var(--code);color:#3d63b8;padding:1px 4px;border-radius:5px}
.tool{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sec);margin:0 0 12px}
.diff{font:12px ui-monospace,Menlo,monospace;padding:1px 5px;border-radius:5px}.add{background:#e3f2e6;color:#2f7a45}.del{background:#f9e3e3;color:#b23b3b}
.me{margin:6px 0 14px auto;max-width:78%;background:var(--clay);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 14px;line-height:1.35;width:fit-content}
.spk{background:var(--soft);border-radius:18px;padding:12px 14px;margin:4px 0 14px}
.spk .h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--clay);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.spk i{font-size:16px;line-height:1.38;display:block}
.play{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--clay);display:grid;place-items:center}.play img{width:11px;height:11px;object-fit:contain}
.comp{flex:none;padding:8px 14px 26px;display:flex;gap:8px;align-items:center;background:linear-gradient(transparent,var(--bg) 30%)}
.field{flex:1;background:#fff;border:1px solid var(--line);border-radius:24px;height:46px;display:flex;align-items:center;padding:0 6px 0 16px;color:var(--sec)}
.send{width:36px;height:36px;border-radius:50%;background:var(--clay);display:grid;place-items:center;margin-left:auto}.send img{width:16px;height:16px;object-fit:contain}
.mic{width:46px;height:46px;border-radius:50%;background:var(--clay);display:grid;place-items:center;flex:none}.mic img{width:20px;height:20px;object-fit:contain}
.chip{display:inline-flex;align-items:center;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip.p{background:var(--clay);color:#fff;border-color:var(--clay)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px}
.mute{color:var(--sec)}
.bar{height:5px;border-radius:99px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;background:var(--clay)}
</style></head><body>
<div class="stage" id="stage"></div>
<script>
const S='symbole/', I=(n,c='k',cl='ic')=>`<img class="${cl}" src="${S}${n}-${c}.png">`;
const sb='<div class="sb"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>';
const nav=(sub='<span style="color:var(--blue)">arbeitet</span>',right=`<span class="circ">${I('ellipsis')}</span>`)=>`<div class="nav"><span class="circ">${I('chevron.left')}</span><div class="ttl"><b>Shirts</b><small>${sub}</small></div>${right}</div>`;
const me='<div class="me">Bau bitte den Export-Button in die Rechnungsliste ein.</div>';
const t1=`<p>Die Liste rendert <code>InvoiceList</code>, der Export fehlt noch. Ich baue ihn als eigene Datei, damit die Liste schlank bleibt.</p>`;
const tool=`<div class="tool">${I('doc.badge.plus','g')} Eine Datei erstellt, einen Befehl ausgeführt <span class="diff add">+62</span><span class="diff del">−0</span> ${I('chevron.right','g')}</div>`;
const t2=`<p>Der Button ist drin und exportiert als <b>CSV</b>. Export-Knopf oben rechts, Branch <code>feature/export</code>.</p>`;
const spoken='Der Export ist eingebaut, Sir. Soll ich auch PDF anbieten?';
const spk=`<div class="spk"><div class="h">${I('speaker.wave.2.fill','c')} Gesprochen <span class="play">${I('play.fill','w')}</span></div><i>${spoken}</i></div>`;
const comp=`<div class="comp"><div class="field">Nachricht an Shirts<span class="send">${I('arrow.up','w')}</span></div></div>`;
const ph=(b,c=comp,n=nav())=>`${sb}${n}<div class="body">${b}</div>${c}`;

// A · Klarer Chat
const A=ph(`${me}${t1}${tool}${t2}${spk}`);

// B · Gesprochen zuerst
const turn=(q,s,more,open)=>`<div style="margin-bottom:16px">${q?`<div class="me" style="margin-bottom:10px">${q}</div>`:''}<div class="card" style="padding:14px"><div style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sec);margin-bottom:6px">${I('speaker.wave.2.fill','c')} Parley <span class="play" style="width:26px;height:26px">${I('play.fill','w')}</span></div><div style="font-size:17px;line-height:1.38">${s}</div>
<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:9px;font-size:13px;color:var(--sec);display:flex;align-items:center;gap:6px">${open?I('chevron.down','g'):I('chevron.right','g')} ${more}</div>${open?`<div style="font-size:14px;margin-top:8px">${t1}${tool}${t2}</div>`:''}</div></div>`;
const B=ph(`${turn('Wie weit ist die Rechnungsliste?','Die Liste steht, Sir. Als Nächstes käme der Export.','Ganze Antwort · 3 Absätze')}${turn('Bau bitte den Export-Button ein.',spoken,'Ganze Antwort · 1 Datei, 1 Befehl, +62',1)}`);

// C · Zeitleiste
const node=(c,body,last)=>`<div style="display:flex;gap:12px"><div style="display:flex;flex-direction:column;align-items:center;width:18px;flex:none"><span style="width:12px;height:12px;border-radius:50%;background:${c};margin-top:4px;flex:none"></span>${last?'':'<span style="flex:1;width:2px;background:var(--line);margin:3px 0"></span>'}</div><div style="flex:1;min-width:0;padding-bottom:14px">${body}</div></div>`;
const C=ph(`<div style="padding-top:4px">
${node('var(--clay)',`<div class="mute" style="font-size:12px">Du · 09:31</div><div style="font-weight:600;margin-top:2px">Bau bitte den Export-Button in die Rechnungsliste ein.</div>`)}
${node('var(--blue)',`<div class="mute" style="font-size:12px">Claude · 09:32</div>${t1.replace('<p>','<p style="margin-top:3px">')}`)}
${node('#cfccc4',`<div class="tool" style="margin:0">${I('terminal','g')} 2 Befehle · <span class="diff add">+62</span></div>`)}
${node('#cfccc4',`<div class="tool" style="margin:0">${I('doc.badge.plus','g')} CSVExport.swift erstellt</div>`)}
${node('var(--blue)',`<div class="mute" style="font-size:12px">Claude · 09:38</div>${t2.replace('<p>','<p style="margin-top:3px">')}`)}
${node('var(--clay)',`<div class="mute" style="font-size:12px">Gesprochen · 09:38</div><i style="font-size:16px;display:block;margin-top:3px">${spoken}</i>`)}
${node('var(--blue)',`<div style="color:var(--blue);font-size:13px;font-weight:600">arbeitet … 0:42</div>`,1)}</div>`);

// D · Status-Kopf wie Blatt
const D=ph(`<div class="card" style="padding:12px 14px;margin:2px 0 14px">
<div style="display:flex;justify-content:space-between;text-align:left">${[['52 min','Laufzeit'],['$2.31','Kosten'],['9 · 4','Updates · Antw.']].map(([a,b])=>`<div><b style="font-size:17px">${a}</b><div class="mute" style="font-size:11.5px">${b}</div></div>`).join('')}</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px" class="mute">Kontext <div class="bar" style="flex:1"><i style="width:57%"></i></div> 57 %</div></div>
${me}${t1}${tool}${t2}${spk}`,comp,nav('<span style="color:var(--blue)">arbeitet · seit 2:18</span>',`<span class="circ" style="background:var(--clay)">${I('phone.fill','w')}</span>`));

// E · Antwort im Fokus
const compE=`<div class="comp" style="flex-direction:column;align-items:stretch;gap:10px;padding-top:14px;background:#fff;border-top:1px solid var(--line);border-radius:26px 26px 0 0">
<div style="font-size:12px;font-weight:600;color:var(--clay);text-transform:uppercase;letter-spacing:.4px">Parley fragt</div>
<div style="font-size:18px;font-weight:600;line-height:1.3">Soll ich auch PDF anbieten?</div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip p">Ja, PDF auch</span><span class="chip">Nein, nur CSV</span><span class="chip">Später</span></div>
<div style="display:flex;gap:8px;align-items:center"><div class="field" style="height:44px">Eigene Antwort …</div><span class="mic">${I('mic.fill','w')}</span></div></div>`;
const E=ph(`<div style="opacity:.55">${me}${t1}${tool}</div>${t2}`,compE);

const V=[["A · Klarer Chat","Deine Nachrichten als Blase rechts, sichtbar statt unter der Leiste versteckt. Der gesprochene Satz als eigene Karte mit Abspielknopf. Doppelter Status im Eingabefeld und Bild-Platzhalter fallen weg.",A],
["B · Gesprochen zuerst","Jede Antwort zeigt zuerst, was Parley gesagt hat – groß. Die ganze Antwort mit Code und Diffs klappt darunter auf. Passt zu einer Sprach-App.",B],
["C · Zeitleiste","Ein Faden von oben nach unten: du, Claude, Werkzeuge, gesprochen – mit Uhrzeit. Man sieht sofort, wo die Session gerade steht.",C],
["D · Status-Kopf","Oben dieselben Kennzahlen wie im Blatt der Übersicht (Laufzeit, Kosten, Kontext). Anrufen direkt oben rechts. Darunter der Chat wie A.",D],
["E · Antwort im Fokus","Wartet Parley auf dich, steht die Frage groß unten mit fertigen Antworten und Mikro. Der Verlauf tritt zurück.",E]];
const only=new URLSearchParams(location.search).get('v');
document.getElementById('stage').innerHTML=V.filter((_,i)=>only==null||+only===i).map(([t,d,b])=>`<div><div class="ph">${b}</div><div class="cap">${t}<small>${d}</small></div></div>`).join('');
</script></body></html>
