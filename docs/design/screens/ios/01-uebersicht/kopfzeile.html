<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Kopfzeile</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#1f1e1c;--sec:#8a8781;--line:#ece9e2;--clay:#d97757;--green:#4fa36a;--track:#efece5}
.dark{--bg:#1b1a18;--card:#262522;--ink:#f3f1ec;--sec:#9a968e;--line:#34322e;--track:#34322e}
*{box-sizing:border-box}body{margin:0;background:#e6e4de;font:15px -apple-system,system-ui,sans-serif;color:#1f1e1c}
.stage{display:grid;grid-template-columns:repeat(4,402px);gap:24px;padding:26px}
.ph{width:402px;height:300px;background:var(--bg);color:var(--ink);border-radius:44px 44px 18px 18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:0 16px;position:relative}
.ph:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,var(--bg))}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font:600 16px -apple-system,system-ui,sans-serif}
h1{font:700 32px -apple-system,system-ui,sans-serif;margin:0}
.row{display:flex;align-items:center;gap:8px}
.gear{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--clay)}
.p{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;font:600 14px -apple-system,system-ui,sans-serif;white-space:nowrap}
.conn{background:#e6f2e9;color:#2f6b42}.dark .conn{background:#22362a;color:#8fd3a6}
.on{background:var(--clay);color:#fff}.off{background:var(--card);color:var(--sec);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:12px}
.big{font:700 22px -apple-system,system-ui,sans-serif}.xs{font-size:11.5px;color:var(--sec)}
.cap{font:600 16px -apple-system,system-ui,sans-serif;margin-top:10px}.cap small{display:block;font-weight:400;color:#6e6c66;font-size:13px;margin-top:2px;line-height:1.35}
.guide{position:absolute;left:16px;right:16px;top:122px;height:38px;border:1.5px dashed rgba(217,119,87,.55);border-radius:10px;pointer-events:none}
.seg{display:inline-flex;height:30px;border-radius:99px;overflow:hidden;background:var(--clay);color:#fff;font:600 14px -apple-system,system-ui,sans-serif}
.seg span{display:flex;align-items:center;gap:6px;padding:0 12px}.seg span+span{border-left:1px solid rgba(255,255,255,.35)}
</style></head><body><div class="stage" id="s"></div>
<script>
const sb='<div class="sb"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>';
const title='<div class="row"><h1>Parley</h1><span class="gear">⚙</span></div>';
const metrics='<div class="card"><div class="row" style="justify-content:space-between"><div><div class="big">$13.61</div><div class="xs">Kosten heute</div></div><div><div class="big">65</div><div class="xs">Updates</div></div><div><div class="big">13 min</div><div class="xs">gesprochen</div></div></div></div>';
const conn=(t="Mac verbunden")=>`<span class="p conn"><span class="dot"></span>${t}</span>`;
const away='<span class="p on">🚘 Unterwegs</span>', mute='<span class="p on">🔕 Stumm</span>';
const V=[
 ["Ist · bricht um","Mit Unterwegs <b>und</b> Stumm passt die Zeile nicht mehr (~404 pt bei 370 pt Platz) – alles rutscht in eine zweite Reihe.",
  `${title}<div style="margin-top:8px">${conn()}</div><div class="row" style="margin-top:8px">${away}${mute}</div>${metrics}`,""],
 ["1 · Stumm als Symbol","„Stumm“ erscheint nur als runder Symbol-Knopf (🔕) – Text sagt der Hinweis/VoiceOver. Gesamt ~330 pt.",
  `${title}<div class="row" style="margin-top:8px">${conn()}<span style="margin-left:auto"></span>${away}<span class="p on" style="width:30px;padding:0;justify-content:center">🔕</span></div>${metrics}`,"g"],
 ["2 · Eine Kapsel","Unterwegs und Stumm werden eine geteilte Kapsel: links Unterwegs, rechts das Stumm-Symbol. Klar zusammengehörig, ~300 pt.",
  `${title}<div class="row" style="margin-top:8px">${conn()}<span style="margin-left:auto"></span><span class="seg"><span>🚘 Unterwegs</span><span>🔕</span></span></div>${metrics}`,"g"],
 ["3 · Kürzerer Status","„Mac verbunden“ wird zum Punkt + „Verbunden“; beide Schalter behalten ihren Text. ~360 pt – knapp, bei großer Schrift greift wieder der Umbruch.",
  `${title}<div class="row" style="margin-top:8px">${conn("Verbunden")}<span style="margin-left:auto"></span>${away}${mute}</div>${metrics}`,"g"],
];
document.getElementById('s').innerHTML=[false,true].map(dk=>V.map(([t,d,b,g])=>`<div><div class="ph ${dk?'dark':''}">${sb}${b}</div>${dk?'':`<div class="cap">${t}<small>${d}</small></div>`}</div>`).join('')).join('');
</script></body></html>
