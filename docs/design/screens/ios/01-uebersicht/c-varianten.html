<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Übersicht C Varianten</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#1f1e1c;--sec:#8a8781;--line:#ece9e2;--clay:#d97757;--blue:#5b8def;--amber:#d9a43b;--purple:#9b87f5;--green:#4fa36a;--grey:#a8a6a0;--track:#efece5}
.dark{--bg:#1b1a18;--card:#262522;--ink:#f3f1ec;--sec:#9a968e;--line:#34322e;--track:#34322e}
*{box-sizing:border-box}body{margin:0;background:#e6e4de;font:15px -apple-system,system-ui,sans-serif;color:var(--ink)}
.stage{display:flex;gap:28px;padding:28px;align-items:flex-start}
.ph{width:402px;height:874px;background:var(--bg);color:var(--ink);border-radius:54px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.18);flex:none}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 34px;font:600 16px -apple-system,system-ui,sans-serif}
.cap{text-align:center;margin-top:12px;font:600 17px -apple-system,system-ui,sans-serif;color:#1f1e1c}.cap small{display:block;font-weight:400;color:#6e6c66;font-size:13px;margin-top:2px}
.pad{padding:0 16px}.row{display:flex;align-items:center;gap:8px}
h1{font:700 32px -apple-system,system-ui,sans-serif;margin:0;letter-spacing:-.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;background:#e6f2e9;color:#2f6b42}
.dark .pill{background:#22362a;color:#8fd3a6}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.gear{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--clay);font-size:19px}
.card{background:var(--card);border-radius:20px;border:1px solid var(--line)}
.btn{background:var(--clay);color:#fff;border-radius:99px;padding:6px 13px;font:600 13px -apple-system,system-ui,sans-serif;display:inline-block;white-space:nowrap}
.muted{color:var(--sec)}.sm{font-size:13px}.xs{font-size:11.5px}
.big{font:700 22px -apple-system,system-ui,sans-serif;letter-spacing:-.3px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.quote{font-size:12.5px;color:var(--sec);font-style:italic;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}.bar>i{display:block;height:100%;background:var(--clay);border-radius:3px}
</style></head><body><div class="stage" id="stage"></div>
<script>
const S=[ // label, state, color, time, action, line, kind
 ["Parley","spricht","var(--clay)","0:13",null,"Die Tests laufen wieder grün. Soll ich den Release vorbereiten?","speak"],
 ["Website","wartet auf Rückruf","var(--amber)","0:26","Rückrufen",null,"wait"],
 ["Angebote","pausiert · noch 4:07","var(--amber)","4:07","Fortsetzen","Ich warte fünf Minuten auf den Build.","wait"],
 ["Shirts","arbeitet","var(--blue)","2:18",null,"Ich baue jetzt die Mockups für die neue Kollektion.","work"],
 ["Relay","Agent im Hintergrund","var(--purple)","3:27",null,"Ein Agent prüft das Protokoll.","bg"],
 ["Edge Army","geparkt","var(--grey)","10:20","Fortsetzen","Zwei neue Kandidaten gefunden. Weitermachen?","park"],
 ["Notizen","bereit","var(--green)","21:09",null,"Alles notiert.","idle"],
 ["Doku","gestoppt","var(--grey)","vor 3 min",null,"Fertig, die Doku ist aktualisiert.","stop"]];
const sb='<div class="sb"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>';
const status='<span class="pill"><span class="dot" style="background:var(--green)"></span>Mac verbunden</span>';
const icon=(s,sz=24)=>{const c=s[2];
 if(s[6]==='speak')return `<span style="width:${sz}px;height:${sz}px;border-radius:50%;border:3px solid ${c};display:grid;place-items:center"><i style="width:${sz/2.6}px;height:${sz/2.6}px;border-radius:50%;background:${c}"></i></span>`;
 if(s[6]==='work')return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--track)" stroke-width="3"/><path d="M12 2.5a9.5 9.5 0 0 1 9.5 9.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
 if(s[6]==='wait')return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--track)" stroke-width="3"/><circle cx="12" cy="12" r="9.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="70 100" transform="rotate(-90 12 12)"/></svg>`;
 if(s[6]==='bg')return `<span style="width:${sz}px;height:${sz}px;border-radius:50%;border:3px solid ${c};opacity:.9;display:grid;place-items:center"><i style="width:${sz/3}px;height:${sz/3}px;border-radius:50%;background:${c}"></i></span>`;
 return `<span style="width:${sz}px;height:${sz}px;border-radius:50%;border:3px solid ${c}"></span>`};
const wave=(n,c,h=18)=>`<span style="display:inline-flex;gap:2px;align-items:center;height:${h}px">${Array.from({length:n},(_,i)=>`<i style="width:3px;border-radius:2px;background:${c};height:${4+Math.abs(Math.sin(i*1.9))*(h-4)}px"></i>`).join('')}</span>`;
const ring=(p,l,sz=40)=>`<div class="card" style="padding:10px 12px;display:flex;align-items:center;gap:10px"><svg width="${sz}" height="${sz}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="var(--track)" stroke-width="5"/><circle cx="20" cy="20" r="16" fill="none" stroke="var(--clay)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100" transform="rotate(-90 20 20)"/></svg><div><b>${p} %</b><div class="xs muted">${l}</div></div></div>`;
const tile=(v,l)=>`<div class="card" style="padding:11px 12px"><div class="big">${v}</div><div class="xs muted">${l}</div></div>`;
// one session card, fixed height; mode: plain | quote
function card(s,mode='plain',h=124){
 const act=s[4]?`<span class="btn" style="padding:5px 11px">${s[4]}</span>`:'';
 const mid=s[6]==='speak'?wave(16,s[2]):(mode==='quote'&&s[5]?`<div class="quote">„${s[5]}"</div>`:'');
 return `<div class="card" style="height:${h}px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;${s[6]==='speak'?'border-color:#f0c9b9;background:linear-gradient(var(--card),var(--card)),var(--card)':''}">
  <div class="row">${icon(s)}<span class="xs muted" style="margin-left:auto">${s[3]}</span></div>
  <div>${mid}<b style="display:block;margin-top:${mid?6:0}px">${s[0]}</b><div class="sm" style="color:${s[2]};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s[1].split(' ·')[0]}</div>${act?`<div style="margin-top:7px">${act}</div>`:''}</div></div>`}
const head=(extra='')=>`<div class="row" style="margin-top:2px"><h1>Parley</h1><span class="gear">⚙</span></div><div class="row" style="margin:6px 0 12px">${status}${extra}</div>`;
const sessHead=`<div class="row" style="margin:16px 2px 8px"><b style="font-size:20px">Sessions</b><span class="muted">7 aktiv</span><span class="btn" style="margin-left:auto">Anrufen</span></div>`;

// C1 · Basis verfeinert
const C1=()=>`${sb}<div class="pad">${head()}
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${tile("$13.61","Kosten heute")}${tile("65","Updates")}${tile("13 min","gesprochen")}</div>
 <div class="grid2" style="margin-top:8px">${ring(42,"5-h-Limit")}${ring(18,"Woche")}</div>
 ${sessHead}<div class="grid2">${[S[0],S[1],S[2],S[3],S[4],S[5]].map(s=>card(s,'plain',132)).join('')}</div></div>`;

// C2 · Eine Kennzahlen-Karte, Karten mit letztem Satz
const C2=()=>`${sb}<div class="pad">${head()}
 <div class="card" style="padding:14px 16px"><div class="row" style="justify-content:space-between">
  <div><div class="big">$13.61</div><div class="xs muted">Kosten heute</div></div><div><div class="big">65</div><div class="xs muted">Updates</div></div><div><div class="big">13 min</div><div class="xs muted">gesprochen</div></div></div>
  <div style="margin-top:12px" class="row"><span class="xs muted" style="width:62px">5-h-Limit</span><div class="bar" style="flex:1"><i style="width:42%"></i></div><span class="xs" style="width:34px;text-align:right">42 %</span></div>
  <div style="margin-top:6px" class="row"><span class="xs muted" style="width:62px">Woche</span><div class="bar" style="flex:1"><i style="width:18%"></i></div><span class="xs" style="width:34px;text-align:right">18 %</span></div></div>
 ${sessHead}<div class="grid2">${[S[0],S[1],S[2],S[3],S[4],S[5]].map(s=>card(s,'quote',156)).join('')}</div></div>`;

// C3 · Ringe wie Apple Fitness
const C3=()=>{const R=(r,p,c)=>`<circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--track)" stroke-width="11"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100" transform="rotate(-90 60 60)"/>`;
 return `${sb}<div class="pad">${head()}
 <div class="card row" style="padding:14px 16px;gap:16px"><svg width="112" height="112" viewBox="0 0 120 120">${R(52,42,"var(--clay)")}${R(38,18,"var(--amber)")}${R(24,65,"var(--blue)")}</svg>
  <div style="display:flex;flex-direction:column;gap:7px"><div><b style="color:var(--clay)">42 %</b> <span class="sm muted">5-h-Limit</span></div><div><b style="color:var(--amber)">18 %</b> <span class="sm muted">Woche</span></div><div><b style="color:var(--blue)">65</b> <span class="sm muted">Updates</span></div><div class="sm muted">$13.61 · 13 min gesprochen</div></div></div>
 ${sessHead}<div class="grid2">${[S[0],S[1],S[2],S[3],S[4],S[5]].map(s=>card(s,'plain',132)).join('')}</div></div>`};

// C4 · C mit Dringlichkeit: wer dich braucht, kommt zuerst und breit
const C4=()=>`${sb}<div class="pad">${head()}
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${tile("$13.61","Kosten heute")}${tile("65","Updates")}${tile("42 %","5-h-Limit")}</div>
 <div class="row" style="margin:16px 2px 8px"><b style="font-size:20px">Braucht dich</b><span class="muted">2</span><span class="btn" style="margin-left:auto">Anrufen</span></div>
 ${[S[1],S[2]].map(s=>`<div class="card row" style="padding:12px 14px;margin-bottom:8px;border-color:#efd9a8">${icon(s,26)}<div style="flex:1"><b>${s[0]}</b><div class="sm" style="color:${s[2]}">${s[1]}</div></div><span class="btn">${s[4]}</span></div>`).join('')}
 <div class="row" style="margin:14px 2px 8px"><b style="font-size:20px">Läuft</b><span class="muted">5</span></div>
 <div class="grid2">${[S[0],S[3],S[4],S[5]].map(s=>card(s,'plain',128)).join('')}</div></div>`;

// C5 · C1 dunkel
const C5=()=>C1();

// Detail 1 · alle Karten-Zustände
const D1=()=>`${sb}<div class="pad"><div class="big" style="margin:4px 2px 4px">Karten-Zustände</div><div class="sm muted" style="margin:0 2px 12px">Gleiche Höhe, Zustand über Symbol, Farbe und eine Aktion</div>
 <div class="grid2">${S.map(s=>card(s,'quote',156)).join('')}</div></div>`;

// Detail 2 · Tippen auf eine Karte öffnet ein Blatt statt aufzuklappen
const D2=()=>{const s=S[4];return `${sb}<div style="position:absolute;inset:54px 0 0;opacity:.35" class="pad">${head()}<div class="grid2">${[S[0],S[1],S[2],S[3]].map(x=>card(x)).join('')}</div></div>
 <div style="position:absolute;left:0;right:0;bottom:0;height:560px;background:var(--bg);border-radius:34px 34px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:10px 20px">
  <div style="width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px"></div>
  <div class="row">${icon(s,34)}<div><div class="big">${s[0]}</div><div class="sm" style="color:${s[2]}">${s[1]} · seit ${s[3]}</div></div><span class="gear" style="font-size:16px">✕</span></div>
  <div class="card" style="margin-top:14px;padding:12px 14px"><div class="xs muted">AGENT</div><div style="color:var(--purple);margin-top:3px">Durable Object gegen das Protokoll testen</div></div>
  <div class="grid2" style="margin-top:10px">${tile("52 min","Laufzeit")}${tile("$2.31","Kosten")}${tile("9 · 4","Updates · Antworten")}
   <div class="card" style="padding:11px 12px"><div class="big">57 %</div><div class="bar" style="margin-top:6px"><i style="width:57%;background:var(--purple)"></i></div><div class="xs muted" style="margin-top:4px">Kontext</div></div></div>
  <div class="card" style="margin-top:10px;padding:12px 14px"><div class="xs muted">ZULETZT GESAGT</div><div style="margin-top:4px;font-style:italic">„${s[5]} Ich melde mich, sobald er fertig ist."</div></div>
  <div class="row" style="margin-top:14px"><span class="btn" style="flex:1;text-align:center;padding:12px">Verlauf öffnen</span><span class="btn" style="flex:1;text-align:center;padding:12px;background:#f6e6df;color:var(--clay)">Nachricht</span></div></div>`};


// C2 mit Umschalter Raster/Liste
const toggle=g=>`<span style="display:inline-flex;background:var(--track);border-radius:10px;padding:2px;margin-left:8px">${[['▦',g],['☰',!g]].map(([t,on])=>`<span style="width:30px;height:26px;display:grid;place-items:center;border-radius:8px;font-size:14px;${on?'background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--ink)':'color:var(--sec)'}">${t}</span>`).join('')}</span>`;
const metrics=()=>`<div class="card" style="padding:14px 16px"><div class="row" style="justify-content:space-between">
  <div><div class="big">$13.61</div><div class="xs muted">Kosten heute</div></div><div><div class="big">65</div><div class="xs muted">Updates</div></div><div><div class="big">13 min</div><div class="xs muted">gesprochen</div></div></div>
  <div style="margin-top:12px" class="row"><span class="xs muted" style="width:62px">5-h-Limit</span><div class="bar" style="flex:1"><i style="width:42%"></i></div><span class="xs" style="width:34px;text-align:right">42 %</span></div>
  <div style="margin-top:6px" class="row"><span class="xs muted" style="width:62px">Woche</span><div class="bar" style="flex:1"><i style="width:18%"></i></div><span class="xs" style="width:34px;text-align:right">18 %</span></div></div>`;
const sessHeadT=g=>`<div class="row" style="margin:16px 2px 8px"><b style="font-size:20px">Sessions</b><span class="muted">7</span>${toggle(g)}<span class="btn" style="margin-left:auto">Anrufen</span></div>`;
const listRow=(s,i)=>`<div style="display:flex;gap:12px;padding:11px 14px;${i?'border-top:1px solid var(--line)':''}">${icon(s,26)}<div style="flex:1;min-width:0"><div class="row"><b>${s[0]}</b><span class="sm" style="color:${s[2]}">${s[1].split(' ·')[0]}</span><span class="xs muted" style="margin-left:auto">${s[3]}</span></div>${s[6]==='speak'?`<div style="margin-top:4px">${wave(22,s[2],14)}</div>`:s[5]?`<div class="quote" style="-webkit-line-clamp:1;margin-top:2px">„${s[5]}"</div>`:''}${s[4]?`<div style="margin-top:6px"><span class="btn" style="padding:4px 11px">${s[4]}</span></div>`:''}</div></div>`;
const C2G=()=>`${sb}<div class="pad">${head()}${metrics()}${sessHeadT(true)}<div class="grid2">${[S[0],S[1],S[2],S[3],S[4],S[5]].map(s=>card(s,'quote',156)).join('')}</div></div>`;
const C2L=()=>`${sb}<div class="pad">${head()}${metrics()}${sessHeadT(false)}<div class="card">${S.map(listRow).join('')}</div></div>`;
const V={g:[C2G,"C2 · Raster","Umschalter neben „Sessions“"],l:[C2L,"C2 · Liste","gleiche Daten, eine Zeile pro Session"],gd:[C2G,"C2 · Raster dunkel","","dark"],ld:[C2L,"C2 · Liste dunkel","","dark"],c1:[C1,"C1 · Basis verfeinert","3 Kennzahlen, 2 Ringe, gleich hohe Karten"],c2:[C2,"C2 · Eine Kennzahlen-Karte","Limits als Balken, Karten mit letztem Satz"],
 c3:[C3,"C3 · Ringe","Limits und Updates wie Apple Fitness"],c4:[C4,"C4 · C + Dringlichkeit","Wer dich braucht, steht breit oben"],
 c5:[C5,"C5 · C1 dunkel","Dunkelmodus","dark"],d1:[D1,"Detail · Karten-Zustände","alle acht Zustände"],d2:[D2,"Detail · Blatt statt Aufklappen","Tippen auf Relay"]};
const only=location.hash.slice(1).split(',').filter(Boolean);
document.getElementById('stage').innerHTML=Object.entries(V).filter(([k])=>!only.length||only.includes(k)).map(([k,[f,t,d,cls]])=>`<div><div class="ph ${cls||''}">${f()}</div><div class="cap">${t}<small>${d}</small></div></div>`).join('');
</script></body></html>
