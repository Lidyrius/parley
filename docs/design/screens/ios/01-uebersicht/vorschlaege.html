<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Übersicht Vorschläge</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#1f1e1c;--sec:#8a8781;--line:#ece9e2;--clay:#d97757;--blue:#5b8def;--amber:#d9a43b;--purple:#9b87f5;--green:#4fa36a;--grey:#a8a6a0}
*{box-sizing:border-box}body{margin:0;background:#e6e4de;font:15px -apple-system,"SF Pro Text",sans-serif;color:var(--ink)}
.stage{display:flex;gap:28px;padding:28px;align-items:flex-start}
.ph{width:402px;height:874px;background:var(--bg);border-radius:54px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.18);flex:none}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 34px;font:600 16px -apple-system}
.cap{text-align:center;margin-top:12px;font:600 17px -apple-system}.cap small{display:block;font-weight:400;color:#6e6c66;font-size:13px;margin-top:2px}
.pad{padding:0 18px}
h1{font:700 32px -apple-system,system-ui,sans-serif;margin:6px 0 2px;letter-spacing:-.5px}
.row{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.gear{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--clay);font-size:19px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec{font:600 13px -apple-system,system-ui,sans-serif;color:var(--sec);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.card{background:var(--card);border-radius:20px;border:1px solid var(--line)}
.btn{background:var(--clay);color:#fff;border-radius:99px;padding:7px 14px;font:600 13px -apple-system,system-ui,sans-serif;display:inline-block}
.btn.ghost{background:#f6e6df;color:var(--clay)}
.muted{color:var(--sec)}.sm{font-size:13px}
.ring{width:30px;height:30px;border-radius:50%;border:3px solid;flex:none}
</style></head><body>
<div class="stage" id="stage"></div>
<script>
const S=[ // label, state, color, time, action
 ["Parley","spricht","var(--clay)","0:13",null,"Die Tests laufen wieder grün. Soll ich den Release vorbereiten?"],
 ["Website","wartet auf Rückruf","var(--amber)","0:26","Rückrufen",null],
 ["Angebote","pausiert · noch 4:07","var(--amber)","",  "Fortsetzen","Ich warte fünf Minuten auf den Build."],
 ["Edge Army","geparkt","var(--grey)","10:20","Fortsetzen","Zwei neue Kandidaten gefunden. Weitermachen?"],
 ["Shirts","arbeitet","var(--blue)","2:18",null,"Ich baue jetzt die Mockups."],
 ["Relay","Agent im Hintergrund","var(--purple)","3:27",null,"Ein Agent prüft das Protokoll."],
 ["Notizen","bereit","var(--green)","21:09",null,null],
 ["Doku","gestoppt","var(--grey)","vor 3 min",null,null]];
const sb='<div class="sb"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>';
const status='<span class="pill" style="background:#e6f2e9;color:#2f6b42"><span class="dot" style="background:var(--green)"></span>Mac verbunden</span>';

// A · Nach Dringlichkeit gruppierte Liste
function A(){
 const grp=(t,rows)=>`<div class="sec">${t}</div><div class="card">`+rows.map((s,i)=>`<div class="row" style="padding:12px 14px;${i?'border-top:1px solid var(--line)':''}"><span class="dot" style="background:${s[2]};width:11px;height:11px"></span><div style="flex:1"><b>${s[0]}</b><div class="sm" style="color:${s[2]}">${s[1]}${s[3]?` <span class="muted">· ${s[3]}</span>`:''}</div></div>${s[4]?`<span class="btn">${s[4]}</span>`:'<span class="muted">›</span>'}</div>`).join('')+'</div>';
 return `${sb}<div class="pad"><div class="row">${status}<span class="gear">⚙</span></div><h1>Parley</h1>
 <div class="card row" style="padding:12px 14px;margin-top:10px;background:#fbefe9;border-color:#f3d6c9"><span class="ring" style="border-color:var(--clay)"></span><div style="flex:1"><b>Parley spricht</b><div class="sm muted">„Die Tests laufen wieder grün …"</div></div><span class="btn">Anrufen</span></div>
 ${grp("Braucht dich · 3",[S[1],S[2],S[3]])}${grp("Arbeitet · 2",[S[4],S[5]])}${grp("Ruhig · 2",[S[6],S[7]])}
 <div class="sm muted" style="text-align:center;margin-top:14px">Heute $13.61 · 65 Updates · 13 min · Limit 42 %</div></div>`}

// B · Live-Bühne
function B(){
 const chip=s=>`<div class="card" style="padding:12px;display:flex;flex-direction:column;gap:6px"><div class="row"><span class="dot" style="background:${s[2]}"></span><b>${s[0]}</b></div><div class="sm" style="color:${s[2]}">${s[1]}</div>${s[4]?`<span class="btn" style="align-self:flex-start;padding:5px 11px">${s[4]}</span>`:`<div class="sm muted">${s[3]}</div>`}</div>`;
 return `${sb}<div class="pad"><div class="row">${status}<span class="gear">⚙</span></div>
 <div style="margin-top:14px;border-radius:30px;padding:22px;color:#fff;background:radial-gradient(circle at 70% 20%,#f0a184,#d97757 45%,#b65a3d);box-shadow:0 12px 30px rgba(217,119,87,.35)">
  <div class="sm" style="opacity:.85">JETZT · seit 0:13</div><div style="font:700 30px -apple-system,system-ui,sans-serif;margin:4px 0 10px">Parley spricht</div>
  <div style="display:flex;gap:3px;align-items:center;height:34px">${Array.from({length:34},(_,i)=>`<span style="width:4px;border-radius:2px;background:rgba(255,255,255,.85);height:${8+Math.abs(Math.sin(i*1.7))*24}px"></span>`).join('')}</div>
  <div style="margin:12px 0 16px;font-size:16px;line-height:1.35">„Die Tests laufen wieder grün. Soll ich den Release vorbereiten?"</div>
  <div class="row"><span class="btn" style="background:#fff;color:var(--clay)">Mithören</span><span class="btn" style="background:rgba(255,255,255,.2)">Antworten</span></div></div>
 <div class="sec">Sessions · 7</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${[S[1],S[2],S[4],S[5],S[3],S[6]].map(chip).join('')}</div></div>`}

// C · Dashboard mit Kennzahlen und gleich hohen Kacheln
function C(){
 const tile=(v,l,c)=>`<div class="card" style="padding:12px;text-align:left"><div style="font:700 22px -apple-system,system-ui,sans-serif;color:${c||'inherit'}">${v}</div><div class="sm muted">${l}</div></div>`;
 const ring=(p,l)=>`<div class="card" style="padding:12px;display:flex;align-items:center;gap:10px"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#efece5" stroke-width="5"/><circle cx="20" cy="20" r="16" fill="none" stroke="var(--clay)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${p}, 100" transform="rotate(-90 20 20)" pathLength="100"/></svg><div><b>${p} %</b><div class="sm muted">${l}</div></div></div>`;
 const card=s=>`<div class="card" style="height:116px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><div class="row"><span class="ring" style="border-color:${s[2]};width:22px;height:22px"></span><span class="muted sm" style="margin-left:auto">${s[3]}</span></div><div><b>${s[0]}</b><div class="sm" style="color:${s[2]}">${s[1]}</div></div>${s[4]?`<span class="btn" style="position:absolute;display:none"></span>`:''}</div>`;
 return `${sb}<div class="pad"><div class="row"><h1 style="margin:0">Parley</h1><span class="gear">⚙</span></div><div style="margin:6px 0 12px">${status}</div>
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${tile("$13.61","Kosten heute")}${tile("65","Updates")}${tile("13 min","gesprochen")}</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">${ring(42,"5-h-Limit")}${ring(18,"Woche")}</div>
 <div class="row" style="margin:16px 4px 8px"><b style="font-size:20px">Sessions</b><span class="muted" style="margin-left:6px">7 aktiv</span><span class="btn" style="margin-left:auto">Anrufen</span></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${[S[0],S[1],S[2],S[4],S[5],S[3]].map(card).join('')}</div></div>`}

// D · Zeitachse / Posteingang
function D(){
 const ev=[["Parley","spricht gerade","„Die Tests laufen wieder grün. Release vorbereiten?“","jetzt","var(--clay)","Antworten"],
  ["Website","möchte zurückgerufen werden","Wartet seit 26 s auf dich.","0:26","var(--amber)","Rückrufen"],
  ["Angebote","pausiert für den Build","„Ich warte fünf Minuten auf den Build.“","4 min","var(--amber)",null],
  ["Doku","ist fertig","„Fertig, die Doku ist aktualisiert.“","3 min","var(--green)",null],
  ["Edge Army","fragt nach","„Zwei neue Kandidaten gefunden. Weitermachen?“","10 min","var(--grey)","Fortsetzen"]];
 const strip=S.slice(0,8).map(s=>`<div style="text-align:center;width:54px;flex:none"><div style="width:46px;height:46px;margin:0 auto;border-radius:50%;border:3px solid ${s[2]};display:grid;place-items:center;font-weight:700;background:#fff">${s[0][0]}</div><div class="sm" style="margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s[0]}</div></div>`).join('');
 return `${sb}<div class="pad"><div class="row"><h1 style="margin:0">Parley</h1><span class="gear">⚙</span></div><div class="sm muted" style="margin:4px 2px 12px">Mac verbunden · heute $13.61 · 65 Updates</div>
 <div style="display:flex;gap:6px;overflow:hidden;margin-bottom:6px">${strip}</div>
 <div class="sec">Neueste zuerst</div>`+ev.map(e=>`<div style="display:flex;gap:12px;margin-bottom:10px"><div style="display:flex;flex-direction:column;align-items:center"><span class="dot" style="background:${e[4]};width:12px;height:12px;margin-top:16px"></span><span style="flex:1;width:2px;background:var(--line);margin-top:4px"></span></div><div class="card" style="flex:1;padding:12px 14px"><div class="row"><b>${e[0]}</b><span class="sm" style="color:${e[4]}">${e[1]}</span><span class="sm muted" style="margin-left:auto">${e[3]}</span></div><div class="sm" style="margin-top:4px;color:#4a4843">${e[2]}</div>${e[5]?`<div style="margin-top:8px"><span class="btn">${e[5]}</span></div>`:''}</div></div>`).join('')+`</div>`}

// E · Ruhig und minimal
function E(){
 return `${sb}<div class="pad" style="padding:0 26px"><div class="row" style="margin-top:4px"><span class="sm muted">Mac verbunden</span><span class="gear">⚙</span></div>
 <div style="margin-top:70px;display:flex;justify-content:center"><div style="width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f6c3ad,#d97757 60%,#b65a3d);box-shadow:0 0 60px rgba(217,119,87,.45)"></div></div>
 <div style="font:600 26px -apple-system,system-ui,sans-serif;line-height:1.25;text-align:center;margin-top:34px">Parley spricht.<br><span style="color:var(--sec)">Zwei warten auf dich.</span></div>
 <div style="text-align:center;margin-top:22px"><span class="btn" style="padding:12px 26px;font-size:16px">Parley anrufen</span></div>
 <div style="margin-top:44px">`+S.slice(0,6).map(s=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="dot" style="background:${s[2]}"></span><span style="flex:1">${s[0]}</span><span class="sm" style="color:${s[2]}">${s[1].split(' ·')[0]}</span></div>`).join('')+`<div class="sm muted" style="text-align:center;margin-top:12px">+ 2 weitere · Heute $13.61</div></div></div>`}

const V={a:[A,"A · Nach Dringlichkeit","Wer dich braucht, steht oben"],b:[B,"B · Live-Bühne","Das Gespräch im Mittelpunkt"],c:[C,"C · Dashboard","Kennzahlen und ruhige Kacheln"],d:[D,"D · Zeitachse","Was ist passiert, neueste zuerst"],e:[E,"E · Ruhig","Ein Satz, eine Kugel, eine Liste"]};
const only=location.hash.slice(1);
document.getElementById('stage').innerHTML=Object.entries(V).filter(([k])=>!only||k===only).map(([k,[f,t,d]])=>`<div><div class="ph">${f()}</div><div class="cap">${t}<small>${d}</small></div></div>`).join('');
</script></body></html>
